<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>스마트 LOTO 세이프핀</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #15171A;
    --panel: #1E2124;
    --panel-alt: #25282C;
    --line: #33373C;
    --danger: #D32F2F;
    --danger-dim: #3A1416;
    --warn: #30C5FF;
    --safe: #4A7C59;
    --safe-dim: #16241D;
    --text: #EDEEEC;
    --text-dim: #9AA0A6;
  }

  * { box-sizing: border-box; }
  svg { display: block; }

  body {
    margin: 0;
    background: #0B0C0D;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 12px;
    font-family: 'Inter', sans-serif;
  }

  .phone {
    width: 380px;
    height: 760px;
    background: var(--bg);
    border-radius: 36px;
    border: 8px solid #0B0C0D;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    color: var(--text);
    transition: background 0.25s ease, color 0.25s ease;
  }

  /* 라이트 모드 오버라이드 (로고 컬러/경고·정상 컬러는 아래에서 변경하지 않음 → 두 모드 동일) */
  .phone.light {
    --bg: #F4F5F6;
    --panel: #FFFFFF;
    --panel-alt: #FFFFFF;
    --line: #E1E4E7;
    --danger-dim: #FBEAEA;
    --warn: #30C5FF;
    --safe-dim: #E9F1EC;
    --text: #1C1E21;
    --text-dim: #6B7176;
  }

  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px 6px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .statusbar .right { display: flex; align-items: center; gap: 6px; }

  .header { padding: 6px 20px 16px; border-bottom: 1px solid var(--line); }

  /* 로고(REMOVE BEFORE FLIGHT 태그) 색상은 다크/라이트 모드와 무관하게 항상 고정 */
  .tagline {
    display: inline-block;
    background: #D32F2F;
    color: #fff;
    font-size: 11px;
    font-family: 'Barlow Condensed', sans-serif;
    padding: 2px 8px;
    border-radius: 3px;
    letter-spacing: 1px;
  }

  .title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 600;
    margin-top: 4px;
  }

  .alarm-banner {
    margin-top: 10px;
    background: var(--danger-dim);
    border: 1px solid var(--danger);
    border-radius: 8px;
    padding: 8px 10px;
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--danger);
  }
  .alarm-banner.show { display: flex; }

  @keyframes blinkBorder {
    0%, 49% { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(211,47,47,0.3); }
    50%, 99% { border-color: var(--line); box-shadow: none; }
    100% { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(211,47,47,0.3); }
  }
  @keyframes blinkOpacity {
    0%, 49% { opacity: 1; }
    50%, 99% { opacity: 0.3; }
    100% { opacity: 1; }
  }
  .alarm-banner.blink-red { animation: blinkOpacity 3.5s infinite; }
  .pin-card.alarm.blink-red { animation: blinkBorder 3.5s infinite; }

  .stopwatch {
    margin-top: 8px; display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--text-dim);
  }
  .stopwatch .time {
    font-family: 'Courier New', monospace; font-size: 14px; letter-spacing: 1px;
    color: var(--text); font-variant-numeric: tabular-nums;
  }

  .content { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }

  .pin-card {
    background: var(--panel);
    border: 1.5px solid var(--safe);
    border-radius: 14px;
    padding: 14px;
    cursor: pointer;
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  .pin-card.alarm {
    background: var(--danger-dim);
    border-color: var(--danger);
    animation: pulseBorder 1.1s infinite;
  }
  @keyframes pulseBorder {
    0%, 100% { box-shadow: 0 0 0 0 rgba(211,47,47,0.35); }
    50% { box-shadow: 0 0 0 6px rgba(211,47,47,0); }
  }

  .pin-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .pin-name { font-size: 15px; font-weight: 700; }
  .pin-loc { font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; margin-top: 2px; }

  .pin-meta { display: flex; align-items: center; gap: 16px; margin-top: 10px; font-size: 13px; }
  .pin-meta .group { display: flex; align-items: center; gap: 5px; }
  .pin-dist { font-weight: 600; }
  .pin-dist.alarm-text { color: var(--danger); }
  .pin-threshold, .pin-batt { font-size: 11px; color: var(--text-dim); }

  .pin-warning { margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--danger); }

  .add-btn {
    background: none;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    color: var(--text-dim);
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
  }

  .log-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 2px;
  }
  .log-header .left { font-size: 12px; color: var(--text-dim); }
  .log-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; row-gap: 6px; }
  .log-action-btn {
    background: none; border: 1px solid var(--line); color: var(--text-dim);
    font-family: inherit; font-size: 11px; font-weight: 600; border-radius: 7px;
    padding: 6px 10px; cursor: pointer;
  }
  .log-action-btn.danger { border-color: var(--danger); color: var(--danger); }
  .log-action-btn.primary { border-color: var(--warn); color: var(--warn); }

  .log-item {
    background: var(--panel);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .log-item.selectable { cursor: pointer; }
  .log-item.selected { outline: 1.5px solid var(--warn); }
  .log-check {
    width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--text-dim);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .log-check.checked { background: var(--warn); border-color: var(--warn); }
  .log-item .lbl { font-size: 13px; font-weight: 600; }
  .log-item .sub { font-size: 11px; color: var(--text-dim); }
  .log-empty { color: var(--text-dim); font-size: 13px; text-align: center; margin-top: 40px; }

  .setting-row {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel); border-radius: 10px; padding: 12px 14px;
    cursor: pointer; border: 1px solid var(--line);
  }
  .setting-row .val { font-size: 13px; color: var(--warn); font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .setting-note { font-size: 11px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }

  .switch {
    position: relative; width: 40px; height: 23px; border-radius: 12px;
    background: var(--line); transition: background 0.2s ease; flex-shrink: 0;
  }
  .switch.on { background: #30C5FF; }
  .switch .knob {
    position: absolute; top: 2.5px; left: 2.5px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: left 0.2s ease;
  }
  .switch.on .knob { left: 19.5px; }

  .tabs { display: flex; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 0 18px; }
  .tab-btn {
    flex: 1; background: none; border: none; display: flex; flex-direction: column;
    align-items: center; gap: 4px; color: #000; font-family: inherit;
    font-size: 11px; font-weight: 500; cursor: pointer; position: relative;
  }
  .phone:not(.light) .tab-btn { color: #fff; }
  .tab-btn.active { font-weight: 700; }
  .tab-btn:not(.active) svg, .tab-btn:not(.active) > span:not(.badge) { opacity: 0.5; }
  .badge {
    position: absolute; top: -2px; right: 28%; background: var(--danger); color: #fff;
    font-size: 9px; border-radius: 8px; padding: 1px 5px; font-weight: 700;
  }

  .sheet-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: flex-end; z-index: 10;
  }
  .sheet-overlay.show { display: flex; }
  .sheet {
    background: var(--panel-alt); width: 100%; border-radius: 20px 20px 0 0;
    padding: 20px 20px 28px; color: var(--text);
  }
  .sheet-close-row { display: flex; justify-content: flex-end; margin-bottom: 4px; }
  .sheet-close { background: none; border: none; color: var(--text-dim); cursor: pointer; }
  .sheet-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
  .sheet-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }

  .status-box {
    border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 600; margin-bottom: 16px;
  }
  .info-row {
    display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .info-row span:first-child { color: var(--text-dim); }
  .info-row span:last-child { font-weight: 600; }

  .primary-btn {
    margin-top: 20px; width: 100%; border: none; border-radius: 10px; padding: 13px;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    background: var(--warn); color: #fff;
  }
  .primary-btn:disabled { background: var(--line); color: var(--text-dim); cursor: not-allowed; }

  .phone.light #reg-submit { background: #30C5FF; color: #fff; }

  .secondary-btn {
    margin-top: 10px; width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    background: none; color: var(--text);
  }

  .field-label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; margin-top: 12px; }
  .field-input {
    width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 11px 12px; color: var(--text); font-size: 14px; outline: none; font-family: inherit;
  }

  .option-row {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel); border-radius: 10px; padding: 13px 14px; margin-top: 8px; cursor: pointer;
    border: 1.5px solid var(--line);
  }
  .option-row.selected { border-color: var(--warn); }
  .option-row .opt-label { font-size: 14px; font-weight: 600; }
  #threshold-options { max-height: 320px; overflow-y: auto; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span class="right"></span>
  </div>

  <div class="header">
    <span class="tagline">REMOVE BEFORE FLIGHT</span>
    <div class="title">스마트 세이프티 핀 모니터</div>
    <div class="alarm-banner" id="alarm-banner"></div>
    <div class="stopwatch" id="stopwatch"></div>
  </div>

  <div class="content" id="content"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="home" id="tab-home"></button>
    <button class="tab-btn" data-tab="log" id="tab-log"></button>
    <button class="tab-btn" data-tab="settings" id="tab-settings"></button>
  </div>

  <div class="sheet-overlay" id="detail-overlay">
    <div class="sheet" id="detail-sheet" onclick="event.stopPropagation()"></div>
  </div>

  <div class="sheet-overlay" id="register-overlay">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-close-row"><button class="sheet-close" onclick="closeRegister()"></button></div>
      <div class="sheet-title">새 세이프티핀 등록</div>
      <label class="field-label">핀 이름</label>
      <input class="field-input" id="reg-name" placeholder="예: 우측 플랩 안전핀" />
      <label class="field-label">장착 위치</label>
      <input class="field-input" id="reg-location" placeholder="예: R/H FLAP" />
      <button class="primary-btn" id="reg-submit" onclick="submitRegister()">BLE 페어링 및 등록</button>
    </div>
  </div>

  <div class="sheet-overlay" id="threshold-overlay">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-close-row"><button class="sheet-close" onclick="closeThreshold()"></button></div>
      <div class="sheet-title">경고 거리 기준</div>
      <div class="sheet-sub">핀이 이 거리 이상 멀어지면 경고가 발생합니다</div>
      <div id="threshold-options"></div>
    </div>
  </div>

  <div class="sheet-overlay" id="confirm-remove-overlay">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-title">⚠ 확인해주세요</div>
      <div class="sheet-sub" id="confirm-remove-text" style="font-size:14px; color:var(--text); margin-bottom:4px;">정비를 완료하였는지 확인하시기 바랍니다</div>
      <button class="primary-btn" onclick="confirmRemovePin()">1. 정비 완료</button>
      <button class="secondary-btn" onclick="closeConfirmRemove()">2. 취소</button>
    </div>
  </div>
</div>

<script>
  // ---------- 아이콘 (lucide 스타일 인라인 SVG) ----------
  const ICONS = {
    bluetooth: (c='currentColor', s=14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>`,
    bluetoothOff: (c='currentColor', s=14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 17-5 5V12l-5 5"/><path d="m2 2 20 20"/><path d="M14.5 9.5 17 7l-5-5v4.5"/></svg>`,
    alert: (c='currentColor', s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    check: (c='currentColor', s=16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
    plus: (c='currentColor', s=16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    x: (c='currentColor', s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
    battery: (c='currentColor', s=13) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="18" height="12" rx="2"/><line x1="23" y1="13" x2="23" y2="11"/></svg>`,
    mappin: (c='currentColor', s=13) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`,
    chevron: (c='currentColor', s=14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`,
    wrench: (c='currentColor', s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"/></svg>`,
    home: (c='currentColor', s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
    bell: (c='currentColor', s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`,
    settings: (c='currentColor', s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>`,
    clock: (c='currentColor', s=14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
    moon: (c='currentColor', s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`,
    trash: (c='currentColor', s=14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  };

  // 알림 상태 색상은 요청에 따라 라이트/다크 모드와 무관하게 항상 고정
  const COLOR_DANGER = '#D32F2F';
  const COLOR_SAFE = '#4A7C59';
  const COLOR_BLUETOOTH = '#0082FC';

  // ---------- 설정 상태 ----------
  const settings = {
    darkMode: false,
    threshold: 5,
    vibration: true,
    sound: true,
    disconnectAlert: true,
  };
  const THRESHOLD_OPTIONS = [5, 10, 15, 20, 30, 40, 50, 100];

  let pins = [
    { id: 'p1', name: '좌측 엔진 기어핀', location: 'L/H ENGINE', distance: 0.6, battery: 82, connected: true },
    { id: 'p2', name: '피토관 커버', location: 'PITOT TUBE', distance: 1.2, battery: 64, connected: true },
    { id: 'p3', name: '랜딩기어 안전핀', location: 'MAIN GEAR', distance: 2.1, battery: 91, connected: true },
  ];
  let log = [];
  let tab = 'home';
  let selectedId = null;
  let pendingRemoveId = null;
  let logSelectMode = false;
  let selectedLogIds = new Set();
  const prevWarning = {};
  let audioCtx = null;

  function timeNow() {
    const d = new Date();
    return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  // 현재 테마에 맞는 강조색(경고/정상 색은 고정, warn/textDim만 테마별로 조정)
  function palette() {
    return {
      danger: COLOR_DANGER,
      safe: COLOR_SAFE,
      warn: '#30C5FF',
      textDim: settings.darkMode ? '#9AA0A6' : '#6B7176',
    };
  }

  // 핀의 경고 상태 판정: 연결이 끊겼으면 연결끊김 기준, 연결돼 있으면 거리 기준
  function pinStatus(p) {
    if (!p.connected) {
      return { warning: settings.disconnectAlert, reason: 'disconnect' };
    }
    const isAlarm = p.distance > settings.threshold;
    return { warning: isAlarm, reason: isAlarm ? 'distance' : null };
  }

  // ---------- 사운드 / 진동 ----------
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    }
    return audioCtx;
  }
  let buzzerUntil = 0;
  function playBeep() {
    if (!settings.sound) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    const nowMs = Date.now();
    if (nowMs < buzzerUntil) return; // 재생 중에는 겹치지 않게
    buzzerUntil = nowMs + 3000;
    try {
      if (ctx.state === 'suspended') ctx.resume();
      const t0 = ctx.currentTime + 0.05;
      // 1초 간격으로 "삐빅" 3번 = 3초
      for (let i = 0; i < 3; i++) {
        const base = t0 + i * 1.0;
        [[0, 0.25, 1000], [0.35, 0.2, 1300]].forEach(([off, dur, freq]) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.value = freq;
          gain.gain.value = 0.15;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(base + off);
          osc.stop(base + off + dur);
        });
      }
    } catch (e) {}
  }
  function triggerVibration() {
    if (!settings.vibration) return;
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  // ---------- 렌더링 ----------
  function applyTheme() {
    document.getElementById('phone').classList.toggle('light', !settings.darkMode);
  }

  function renderTabs() {
    const pal = palette();
    document.getElementById('tab-home').innerHTML = `${ICONS.home(pal.warn)}<span>홈</span>`;
    document.getElementById('tab-log').innerHTML = `${ICONS.bell(pal.warn)}<span>알림 기록</span>${log.length ? `<span class="badge">${log.length}</span>` : ''}`;
    document.getElementById('tab-settings').innerHTML = `${ICONS.settings(pal.warn)}<span>설정</span>`;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  }

  function renderAlarmBanner() {
    const el = document.getElementById('alarm-banner');
    const warningPins = pins.filter(p => pinStatus(p).warning);
    if (warningPins.length > 0) {
      el.classList.add('show');
      el.classList.toggle('blink-red', warningPins.some(p => pinStatus(p).reason === 'disconnect'));
      el.innerHTML = `${ICONS.alert(COLOR_DANGER, 16)}<span>핀 ${warningPins.length}개가 경고 상태입니다</span>`;
    } else {
      el.classList.remove('show', 'blink-red');
      el.innerHTML = '';
    }
  }

  function renderStatusBar() {
    const pal = palette();
    const connectedCount = pins.filter(p => p.connected).length;
    document.querySelector('.statusbar .right').innerHTML =
      `${ICONS.bluetooth(COLOR_BLUETOOTH, 13)}<span>BLE ${connectedCount}개 연결됨</span>`;
  }

  function pinCardHtml(p) {
    const pal = palette();
    const status = pinStatus(p);
    const isAlarm = status.warning;
    const statusIcon = !p.connected
      ? ICONS.bluetoothOff(isAlarm ? COLOR_DANGER : pal.textDim, 18)
      : (isAlarm ? ICONS.alert(COLOR_DANGER, 20) : ICONS.bluetooth(COLOR_BLUETOOTH, 18));

    const isDisconnectAlarm = isAlarm && status.reason === 'disconnect';
    // 렌더링마다 요소가 새로 만들어져도 깜빡임 위상이 이어지도록 시계 기준으로 지연값 계산
    const period = isDisconnectAlarm ? 3500 : 1100;
    const animStyle = isAlarm ? ` style="animation-delay:-${((Date.now() % period) / 1000).toFixed(3)}s"` : '';
    let warningText = '';
    if (status.reason === 'disconnect') {
      warningText = '⚠ BLE 연결이 끊겼습니다 — 핀 위치를 즉시 확인하세요';
    } else if (status.reason === 'distance') {
      warningText = '⚠ 안전 핀이 기체에서 분리되지 않은 채 이동 중입니다';
    }

    return `
      <div class="pin-card ${isAlarm ? 'alarm' : ''} ${isDisconnectAlarm ? 'blink-red' : ''}"${animStyle} onclick="openDetail('${p.id}')">
        <div class="pin-top">
          <div>
            <div class="pin-name">${p.name}</div>
            <div class="pin-loc">${p.location}</div>
          </div>
          ${statusIcon}
        </div>
        <div class="pin-meta">
          <div class="group">${ICONS.mappin(isAlarm ? COLOR_DANGER : pal.textDim)}
            <span class="pin-dist ${isAlarm && status.reason==='distance' ? 'alarm-text' : ''}">${p.connected ? p.distance.toFixed(1)+'m' : '—'}</span>
            <span class="pin-threshold">/ 기준 ${settings.threshold}m</span>
          </div>
          <div class="group">${ICONS.battery(pal.textDim)}<span class="pin-batt">${p.battery}%</span></div>
        </div>
        ${warningText ? `<div class="pin-warning">${warningText}</div>` : ''}
      </div>`;
  }

  function renderHome() {
    const pal = palette();
    return `<div class="stack">
      ${pins.map(pinCardHtml).join('')}
      <button class="add-btn" onclick="openRegister()">${ICONS.plus(pal.textDim)}<span>새 세이프티핀 등록</span></button>
    </div>`;
  }

  function renderLog() {
    const pal = palette();
    const headerHtml = log.length === 0 ? '' : `
      <div class="log-header">
        <span class="left">${logSelectMode ? `${selectedLogIds.size}개 선택됨` : `총 ${log.length}건`}</span>
        <div class="log-actions">
          ${logSelectMode ? `
            <button class="log-action-btn" onclick="toggleSelectAllLogs()">전체선택</button>
            <button class="log-action-btn danger" onclick="clearAllLogs()">전체삭제</button>
            <button class="log-action-btn danger" onclick="deleteSelectedLogs()">${ICONS.trash(COLOR_DANGER)}삭제</button>
            <button class="log-action-btn" onclick="exitLogSelectMode()">취소</button>
          ` : `
            <button class="log-action-btn" onclick="enterLogSelectMode()">선택 삭제</button>
          `}
        </div>
      </div>`;

    if (log.length === 0) return `<div class="log-empty">아직 기록된 알림이 없습니다.</div>`;

    const itemsHtml = log.map(item => {
      const selected = selectedLogIds.has(item.id);
      const borderColor = item.type === 'resolved' ? COLOR_SAFE : COLOR_DANGER;
      const icon = item.type === 'resolved' ? ICONS.check(COLOR_SAFE, 16) : ICONS.alert(COLOR_DANGER, 16);
      const clickAttr = logSelectMode ? `onclick="toggleLogItemSelect('${item.id}')"` : '';
      return `
      <div class="log-item ${logSelectMode ? 'selectable' : ''} ${selected ? 'selected' : ''}" ${clickAttr} style="border-left:3px solid ${borderColor}">
        ${logSelectMode ? `<div class="log-check ${selected ? 'checked' : ''}">${selected ? ICONS.check('#fff', 11) : ''}</div>` : icon}
        <div style="flex:1">
          <div class="lbl">${item.label}</div>
          <div class="sub">${item.location} · ${item.time}</div>
        </div>
      </div>`;
    }).join('');

    return headerHtml + `<div class="stack" style="margin-top:10px">${itemsHtml}</div>`;
  }

  function renderSettings() {
    return `<div class="stack">
      <div class="setting-row" onclick="toggleSetting('darkMode')">
        <span>다크 모드</span>
        <div class="switch ${settings.darkMode ? 'on' : ''}"><div class="knob"></div></div>
      </div>
      <div class="setting-row" onclick="openThreshold()">
        <span>경고 거리 기준</span>
        <span class="val">${settings.threshold}m ${ICONS.chevron(palette().warn)}</span>
      </div>
      <div class="setting-row" onclick="toggleSetting('vibration')">
        <span>진동 알림</span>
        <div class="switch ${settings.vibration ? 'on' : ''}"><div class="knob"></div></div>
      </div>
      <div class="setting-row" onclick="toggleSetting('sound')">
        <span>사운드 알림</span>
        <div class="switch ${settings.sound ? 'on' : ''}"><div class="knob"></div></div>
      </div>
      <div class="setting-row" onclick="toggleSetting('disconnectAlert')">
        <span>연결 끊김 자동 경고</span>
        <div class="switch ${settings.disconnectAlert ? 'on' : ''}"><div class="knob"></div></div>
      </div>
      <div class="setting-note">핀이 ${settings.threshold}m 이상 멀어지거나${settings.disconnectAlert ? ' BLE 연결이 끊기면' : ' (연결 끊김 경고는 꺼져 있습니다)'} 즉시 경고합니다. 정비 완료 후 핀을 제거하면 자동으로 목록에서 비활성화됩니다. 진동은 기기(주로 안드로이드) 지원 여부에 따라 동작하지 않을 수 있습니다.</div>
    </div>`;
  }

  function renderContent() {
    const el = document.getElementById('content');
    if (tab === 'home') el.innerHTML = renderHome();
    else if (tab === 'log') el.innerHTML = renderLog();
    else el.innerHTML = renderSettings();
  }

  function renderAll() {
    applyTheme();
    renderTabs();
    renderAlarmBanner();
    renderStatusBar();
    renderContent();
  }

  // ---------- 탭 전환 ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      tab = btn.dataset.tab;
      if (tab !== 'log') { logSelectMode = false; selectedLogIds.clear(); }
      renderAll();
    });
  });

  // ---------- 설정 토글 / 거리 기준 ----------
  function toggleSetting(key) {
    settings[key] = !settings[key];
    if (key === 'sound' && settings.sound) ensureAudio();
    renderAll();
  }

  function openThreshold() {
    const pal = palette();
    const box = document.getElementById('threshold-options');
    box.innerHTML = THRESHOLD_OPTIONS.map(v => `
      <div class="option-row ${v === settings.threshold ? 'selected' : ''}" onclick="selectThreshold(${v})">
        <span class="opt-label">${v}m</span>
        ${v === settings.threshold ? ICONS.check(pal.warn) : ''}
      </div>`).join('');
    document.getElementById('threshold-overlay').classList.add('show');
    document.getElementById('threshold-overlay').onclick = closeThreshold;
  }
  function closeThreshold() {
    document.getElementById('threshold-overlay').classList.remove('show');
  }
  function selectThreshold(v) {
    settings.threshold = v;
    closeThreshold();
    renderAll();
    if (selectedId) renderDetail();
  }

  // ---------- 알림 기록 삭제 ----------
  function enterLogSelectMode() { logSelectMode = true; selectedLogIds = new Set(); renderAll(); }
  function exitLogSelectMode() { logSelectMode = false; selectedLogIds.clear(); renderAll(); }
  function toggleLogItemSelect(id) {
    if (selectedLogIds.has(id)) selectedLogIds.delete(id); else selectedLogIds.add(id);
    renderAll();
  }
  function toggleSelectAllLogs() {
    if (selectedLogIds.size === log.length) selectedLogIds.clear();
    else selectedLogIds = new Set(log.map(l => l.id));
    renderAll();
  }
  function deleteSelectedLogs() {
    if (selectedLogIds.size === 0) return;
    log = log.filter(l => !selectedLogIds.has(l.id));
    logSelectMode = false;
    selectedLogIds.clear();
    renderAll();
  }
  function clearAllLogs() {
    if (log.length === 0) return;
    if (confirm('알림 기록을 모두 삭제할까요?')) {
      log = [];
      renderAll();
    }
  }

  // ---------- 상세보기 시트 ----------
  function openDetail(id) {
    selectedId = id;
    const overlay = document.getElementById('detail-overlay');
    overlay.classList.add('show');
    overlay.onclick = closeDetail;
    renderDetail();
  }
  function closeDetail() {
    document.getElementById('detail-overlay').classList.remove('show');
    selectedId = null;
  }
  function renderDetail() {
    const p = pins.find(x => x.id === selectedId);
    if (!p) return;
    const status = pinStatus(p);
    const isAlarm = status.warning;
    let statusText = '정상 — 정비사와 근접 거리 내에서 정상 연결 중입니다';
    if (status.reason === 'disconnect') statusText = '⚠ BLE 연결이 끊긴 상태입니다';
    else if (status.reason === 'distance') statusText = '⚠ 현재 경고 상태 — 핀이 안전 거리를 초과했습니다';

    document.getElementById('detail-sheet').innerHTML = `
      <div class="sheet-close-row"><button class="sheet-close" onclick="closeDetail()">${ICONS.x()}</button></div>
      <div class="sheet-title">${ICONS.wrench(palette().warn)}<span>${p.name}</span></div>
      <div class="sheet-sub">${p.location}</div>
      <div class="status-box" style="background:${isAlarm ? 'var(--danger-dim)' : 'var(--safe-dim)'}; border:1px solid ${isAlarm ? COLOR_DANGER : COLOR_SAFE}; color:${isAlarm ? COLOR_DANGER : COLOR_SAFE}">
        ${statusText}
      </div>
      <div class="info-row"><span>현재 거리</span><span>${p.connected ? p.distance.toFixed(1)+'m' : '측정 불가'}</span></div>
      <div class="info-row"><span>경고 기준 거리</span><span>${settings.threshold}m</span></div>
      <div class="info-row"><span>배터리</span><span>${p.battery}%</span></div>
      <div class="info-row"><span>연결 상태</span><span>${p.connected ? 'BLE 연결됨' : '연결 끊김'}</span></div>
      <button class="primary-btn" onclick="openConfirmRemove('${p.id}')">정비 완료 — 핀 제거 처리</button>
      <button class="secondary-btn" onclick="toggleConnection('${p.id}')">${p.connected ? 'BLE 연결 끊김 시뮬레이션 (테스트)' : 'BLE 재연결 시뮬레이션 (테스트)'}</button>
    `;
  }
  function removePin(id) {
    pins = pins.filter(p => p.id !== id);
    closeDetail();
    renderAll();
  }
  function openConfirmRemove(id) {
    pendingRemoveId = id;
    const overlay = document.getElementById('confirm-remove-overlay');
    overlay.classList.add('show');
    overlay.onclick = closeConfirmRemove;
  }
  function closeConfirmRemove() {
    document.getElementById('confirm-remove-overlay').classList.remove('show');
    pendingRemoveId = null;
  }
  function confirmRemovePin() {
    if (pendingRemoveId) removePin(pendingRemoveId);
    closeConfirmRemove();
  }
  function toggleConnection(id) {
    const p = pins.find(x => x.id === id);
    if (!p) return;
    p.connected = !p.connected;
    renderDetail();
    renderAll();
  }

  // ---------- 신규 등록 시트 ----------
  function openRegister() {
    document.getElementById('reg-name').value = '';
    document.getElementById('reg-location').value = '';
    document.getElementById('register-overlay').classList.add('show');
    document.getElementById('register-overlay').onclick = closeRegister;
  }
  function closeRegister() {
    document.getElementById('register-overlay').classList.remove('show');
  }
  function submitRegister() {
    const name = document.getElementById('reg-name').value.trim();
    const location = document.getElementById('reg-location').value.trim() || '미지정';
    if (!name) return;
    pins.push({ id: 'p' + Date.now(), name, location, distance: 0.3, battery: 100, connected: true });
    closeRegister();
    renderAll();
  }

  // ---------- 거리 시뮬레이션 (BLE RSSI 기반 거리 변화 모사) ----------
  setInterval(() => {
    pins.forEach(p => {
      if (!p.connected) return;
      const drift = (Math.random() - 0.42) * 1.4;
      p.distance = Math.max(0.2, Math.round((p.distance + drift) * 10) / 10);
    });

    let newlyWarned = false;
    pins.forEach(p => {
      const status = pinStatus(p);
      const was = prevWarning[p.id];
      if (status.warning && !was) {
        newlyWarned = true;
        const label = status.reason === 'disconnect'
          ? `${p.name} BLE 연결 끊김 경고`
          : `${p.name} 거리 초과 경고 발생`;
        log.unshift({ id: p.id + '-' + Date.now(), label, location: p.location, time: timeNow(), type: 'alarm' });
      } else if (!status.warning && was) {
        log.unshift({ id: p.id + '-' + Date.now(), label: `${p.name} 정상 복귀`, location: p.location, time: timeNow(), type: 'resolved' });
      }
      prevWarning[p.id] = status.warning;
      log = log.slice(0, 30);
    });

    if (newlyWarned) {
      playBeep();
      triggerVibration();
    }

    renderAll();
    if (selectedId) renderDetail();
  }, 1400);

  // ---------- 정비 시간 스톱워치 (정지·초기화 버튼 없음) ----------
  const appStartTime = Date.now();
  function formatDuration(ms) {
    const total = Math.floor(ms / 1000);
    const h = String(Math.floor(total / 3600)).padStart(2, '0');
    const m = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
    const sec = String(total % 60).padStart(2, '0');
    return `${h}:${m}:${sec}`;
  }
  function updateStopwatch() {
    const pal = palette();
    document.getElementById('stopwatch').innerHTML =
      `${ICONS.clock(pal.textDim, 14)}<span>현재 정비 시간</span><span class="time">${formatDuration(Date.now() - appStartTime)}</span>`;
  }
  setInterval(updateStopwatch, 1000);
  updateStopwatch();

  renderAll();
</script>

</body>
</html>
